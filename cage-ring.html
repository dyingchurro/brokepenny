<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script>
/* Desktop (mouse/trackpad): never switch to the tablet/phone layout when the window is made narrower —
   scale the whole 1280px desktop design down evenly instead. Touch devices keep the responsive layout. */
(function(){
  var DESIGN = 1280, MIN = 600;
  var desktop = window.matchMedia('(hover: hover) and (pointer: fine)');
  function fit(){
    var w = window.innerWidth;
    var z = (desktop.matches && w < DESIGN && w >= MIN) ? w / DESIGN : 1;
    window.__pz = z;
    var r = document.documentElement;
    r.style.zoom = z === 1 ? '' : String(z);
    r.style.setProperty('--z', String(z));
  }
  fit();
  window.addEventListener('resize', fit);
  if(desktop.addEventListener) desktop.addEventListener('change', fit);
})();
</script>

<title>Penny — Cage Ring</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300&family=Roboto:wght@500&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0c0c0c;--ink-mid:#3a3a3a;--ink-faint:#7a7a7a;
  --ink-ghost:#c0bcb6;--paper:#ffffff;--paper-off:#ffffff;
  --burgundy:#6e1423;
}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:'Manrope',sans-serif;overflow-x:hidden;}

/* NAV */
nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:160px;
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:16px 44px 0;
  background:#ffffff;
  border-bottom:1px solid var(--ink);
  backdrop-filter:blur(8px);
  overflow:visible;
}
.nav-logo{display:block;position:relative;z-index:300;text-decoration:none;overflow:visible;flex-shrink:0;}
.nav-logo img{height:220px;width:auto;display:block;position:relative;top:-10px;left:-16px;}
.nav-right{display:flex;flex-direction:column;align-items:flex-end;gap:20px;padding-top:8px;}
.penny-seal{display:block;width:90px;height:90px;object-fit:contain;mix-blend-mode:multiply;cursor:pointer;transition:transform 0.2s;}
.penny-seal:hover{transform:scale(1.06) rotate(-3deg);}
.nav-links{display:flex;gap:36px;list-style:none;padding-bottom:16px;}
.nav-links a{font-family:'Manrope',sans-serif;font-size:0.68rem;letter-spacing:0.18em;color:var(--ink-mid);text-decoration:none;transition:color 0.2s;text-transform:lowercase;}
.nav-links a:hover{color:var(--ink)}
.nav-item{position:relative;}
.nav-item::after{content:'';position:absolute;top:100%;left:-20px;right:-20px;height:16px;background:transparent;}
.dropdown{
  position:absolute;top:100%;left:50%;
  transform:translateX(-50%) translateY(-6px);
  padding-top:12px;
  background:#ffffff;
  border:1px solid var(--ink-ghost);
  backdrop-filter:blur(10px);
  min-width:180px;padding:14px 0;
  opacity:0;pointer-events:none;
  transition:opacity 0.2s ease,transform 0.2s ease;
  z-index:500;
}
.nav-item:hover .dropdown,.nav-item:focus-within .dropdown{
  opacity:1;pointer-events:all;transform:translateX(-50%) translateY(0);
}
.dropdown-item{
  display:flex;align-items:center;gap:10px;padding:8px 20px;
  font-family:'Manrope',sans-serif;font-size:0.68rem;
  letter-spacing:0.14em;color:var(--ink-mid);text-decoration:none;
  transition:color 0.15s,background 0.15s;white-space:nowrap;
}
.dropdown-item:hover{color:var(--ink);background:rgba(0,0,0,0.04);}
.dropdown-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--burgundy);flex-shrink:0;}

/* ── SIDE FLYOUT (nested submenu under "type") ── */
.dropdown-sub {
  position: relative;
}
.side-dropdown {
  position: absolute;
  top: -14px;
  left: 100%;
  background: #ffffff;
  border: 1px solid var(--ink-ghost);
  backdrop-filter: blur(10px);
  min-width: 180px;
  padding: 14px 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  transform: translateX(-6px);
  z-index: 600;
}
.dropdown-sub:hover .side-dropdown,
.dropdown-sub:focus-within .side-dropdown {
  opacity: 1;
  pointer-events: all;
  transform: translateX(0);
}
.dropdown-sub::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  left: 100%;
  width: 20px;
  background: transparent;
}

.hero-spacer{height:160px;}

/* PAGE HEADER */
.page-header{
  padding:48px 44px 32px;
  border-bottom:1px solid var(--ink-ghost);
}
.page-title{
  font-family:'Archivo',sans-serif;
  font-weight:300;
  text-transform:uppercase;
  font-size:clamp(28px,4vw,48px);
  line-height:1.1;
  color:var(--ink);
}

/* PHOTO GRID — matches the reference image exactly */
.photo-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:24px;
  background:#ffffff;
  
}

.grid-cell{
  border-right:none;
  border-bottom:none;
  background:#ffffff;
  cursor:pointer;
  transition:background 0.2s;
  position:relative;
  overflow:hidden;
  display:block;
  text-decoration:none;
}
.grid-cell:hover{background:#ffffff;}
.grid-cell:nth-child(5n){border-right:none;}

.cell-inner{
  aspect-ratio:3/4;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20%;
  position:relative;
}
.cell-inner svg{
  width:100%;height:100%;
  opacity:0.8;
}

/* Footer */
footer{
  padding:32px 44px;border-top:1px solid var(--ink);
  display:flex;justify-content:flex-end;align-items:center;
  background:var(--paper);
}
.f-logo img{height:36px;width:auto;opacity:0.5;}
.f-copy{font-family:'Manrope',sans-serif;font-size:0.54rem;letter-spacing:0.14em;color:var(--ink-ghost);text-align:right;}

.footer-links{display:flex;gap:28px;list-style:none;}
.footer-links a{font-family:'Manrope',sans-serif;font-size:0.62rem;letter-spacing:0.16em;color:var(--ink-mid);text-decoration:none;text-transform:lowercase;transition:color 0.2s;}
.footer-links a:hover{color:var(--ink);}
@media (hover:none) and (max-width:1024px), (max-width:599px){
  nav{height:120px;padding:14px 26px 0;}
  .nav-logo img{height:112px;top:-6px;left:-10px;}
  .penny-seal{width:64px;height:64px;}
  .nav-links{gap:22px;}
  .nav-links a{font-size:0.62rem;}
  .hero-spacer{height:120px;}
  .photo-grid{grid-template-columns:repeat(4,1fr);gap:18px;}
  .page-header{padding:36px 26px 26px;}
  .footer-links{gap:20px;}
}

@media (hover:none) and (max-width:640px), (max-width:599px){
  nav{
    height:auto;
    flex-wrap:wrap;
    justify-content:center;
    row-gap:10px;
    padding:14px 16px 12px;
  }
  .nav-logo{width:100%;display:flex;justify-content:center;}
  .nav-logo img{height:60px;top:0;left:0;}
  .nav-right{width:100%;flex-direction:row;align-items:center;justify-content:center;gap:20px;padding-top:0;}
  .penny-seal{width:40px;height:40px;}
  .nav-links{gap:14px;}
  .nav-links a{font-size:0.56rem;letter-spacing:0.12em;}
  .hero-spacer{height:187px;}
  .photo-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
  .page-header{padding:24px 16px 20px;}
  footer{padding:24px 20px;flex-direction:column;gap:16px;align-items:flex-start;}
  .footer-links{gap:16px;flex-wrap:wrap;}
}


/* ── PRODUCT DETAIL PAGE ── */

/* compact title row -- product name + price side by side, no back link, no divider */
.product-title-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin-bottom:24px;
}
.product-name{
  font-family:'Roboto',sans-serif;
  font-weight:500;
  font-size:0.8rem;
  line-height:1.1;
  letter-spacing:0.1em;
  color:var(--ink);
  margin:0;
  display:flex;
  align-items:center;
  gap:6.5px;
}
.title-dot{
  display:inline-block;
  flex-shrink:0;
  width:13px;
  height:13px;
  border-radius:50%;
  background:var(--ink);
  position:relative;
  top:-1px;
}

.product-wrap{
  display:grid;
  grid-template-columns:440px 1fr;
  gap:56px;
  padding:48px 44px 64px;
  align-items:start;
}
.product-info{order:1;}
.gallery{order:2;width:50%;}  /* photo deck at half the column width */

/* gallery */
.gallery-main{
  background:#ffffff;
  border:none;
  display:flex;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  margin-bottom:16px;
  scrollbar-width:none;
}
.gallery-main::-webkit-scrollbar{display:none;}
.gallery-slide{
  flex:0 0 100%;
  width:100%;
  position:relative;
  scroll-snap-align:start;
}
/* each slide is a true square (padding spacer), picture pinned inside so it can't stretch it */
.gallery-slide::before{content:'';display:block;padding-top:100%;}
.gallery-slide svg{position:absolute;top:14%;left:14%;width:72%;height:72%;opacity:0.85;}
.gallery-slide img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1;}
.gallery-dots{
  display:flex;
  justify-content:center;
  gap:10px;
}
.gallery-dot{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--ink-ghost);
  cursor:pointer;
  transition:background 0.15s;
}
.gallery-dot.active{background:var(--ink);}

/* info column */
.product-price{
  font-family:'Roboto',sans-serif;
  font-weight:500;
  font-size:0.8rem;
  letter-spacing:0.1em;
  color:var(--ink);
  white-space:nowrap;
}

/* spec table — label/value rows with hairline dividers, like the reference's grid table */
.spec-table{
  border-top:2px solid var(--ink);
  margin-bottom:32px;
}
.spec-row{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:8px 0;
  border-bottom:2px solid var(--ink);
}
.spec-label{
  font-family:'Roboto',sans-serif;
  font-weight:500;
  font-size:0.8rem;letter-spacing:0.1em;
  color:var(--ink);
}
.spec-value{
  font-family:'Roboto',sans-serif;
  font-weight:500;
  font-size:0.8rem;
  letter-spacing:0.1em;
  color:var(--ink);
  text-align:right;
}

.spec-select{
  border:none;background:transparent;
  font-family:'Roboto',sans-serif;
  font-weight:500;
  font-size:0.8rem;
  letter-spacing:0.1em;
  color:var(--ink);
  text-align:right;
  cursor:pointer;
  outline:none;
}

.spec-row-action{
  cursor:pointer;
}
.add-to-cart-btn{
  background:transparent;border:none;
  color:var(--ink);
  font-family:'Roboto',sans-serif;
  font-weight:500;
  font-size:0.8rem;letter-spacing:0.1em;
  padding:0;margin:0;
  cursor:pointer;
  text-align:left;
  width:100%;
  transition:color 0.15s;
}
.add-to-cart-btn:hover{color:var(--ink-faint);}
.add-to-cart-btn.added{color:var(--ink-faint);}

.size-warning{
  display:none;
  font-family:'Roboto',sans-serif;
  font-weight:500;
  font-size:0.68rem;letter-spacing:0.04em;
  color:var(--burgundy);
  text-align:center;
  margin-top:12px;
}
.size-warning.visible{display:block;}

@media (hover:none) and (max-width:900px), (max-width:599px){
  .product-wrap{grid-template-columns:1fr;padding:20px 18px 48px;}
  .product-title-row{margin-bottom:16px;}
}

/* nav, dropdown + footer links use the buy-box font: Roboto 500, black, 0.1em; grey on hover */
.nav-links a,.dropdown-item,.footer-links a{font-family:'Roboto',sans-serif;font-weight:500;font-size:0.8rem;letter-spacing:0.1em;color:var(--ink);}
.nav-links a:hover,.dropdown-item:hover,.footer-links a:hover{color:var(--ink-faint);}
.dropdown-item:hover{background:transparent;}
@media (hover:none) and (max-width:1024px), (max-width:599px){.nav-links a,.dropdown-item,.footer-links a{font-size:0.74rem;}}
@media (hover:none) and (max-width:640px), (max-width:599px){.nav-links a,.dropdown-item,.footer-links a{font-size:0.7rem;letter-spacing:0.08em;}}

/* ── PHONE LAYOUT polish ── */
@media (hover:none) and (max-width:640px), (max-width:599px){
  /* nav: same arrangement as desktop, just smaller — logo top-left, seal top-right, links bottom-right */
  nav{height:116px;flex-wrap:nowrap;justify-content:flex-end;align-items:flex-start;row-gap:0;padding:8px 16px 0;}
  .nav-logo{width:auto;display:block;position:absolute;left:10px;top:8px;}
  .nav-logo img{height:76px;top:0;left:0;}
  .nav-right{width:100%;height:100%;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:0;padding:2px 0 12px;}
  .nav-links a{white-space:nowrap;}
  .nav-right > a{width:44px !important;height:44px !important;}
  .penny-seal{width:44px;height:44px;}
  .nav-links{gap:16px;padding-bottom:0;}
  .hero-spacer{height:116px;}
  /* footer: links right-aligned like desktop */
  footer{flex-direction:row;justify-content:flex-end;align-items:center;padding:20px 16px;}
  .footer-links{gap:20px;}
  /* photos first, then the details */
  .product-wrap{gap:20px;padding:20px 16px 48px;}
  .gallery{order:1;width:100%;}
  .product-info{order:2;}
}
</style>
<script>
/* Photo slots: each <img> tries images/NAME.webp first, then .jpg, .jpeg, .png.
   If none exists yet, it hides itself and the placeholder drawing underneath shows instead. */
function pennyImgFallback(img){
  var list = (img.getAttribute('data-fallbacks') || '').split(',').filter(Boolean);
  if(list.length){ img.setAttribute('data-fallbacks', list.slice(1).join(',')); img.src = list[0]; return; }
  img.setAttribute('data-failed', '1');
  img.removeAttribute('onerror');
  img.style.display = 'none';
  if(window.pennyImgSettled) window.pennyImgSettled();
}
</script>
</head>

(function(){
  var PRODUCT_NAME = 'Cage Ring';

  var main = document.getElementById('galleryMain');
  var dotsWrap = document.getElementById('galleryDots');
  var slides = [], dots = [];

  function setActiveDot(i){
    dots.forEach(function(d, k){ d.classList.toggle('active', k === i); });
  }

  // Show only the slides whose photo exists. With no photos yet, keep the placeholder drawings.
  function buildGallery(){
    var all = [].slice.call(main.querySelectorAll('.gallery-slide'));
    var loaded = function(im){ return im && !im.hasAttribute('data-failed') && im.complete && im.naturalWidth > 0; };
    var waiting = function(im){ return im && !im.hasAttribute('data-failed') && !loaded(im); };
    // Only slides whose photo has loaded are shown (more appear as they finish loading).
    // Until the first photo arrives, one empty frame holds the space.
    var withPhoto = all.filter(function(sl){ return loaded(sl.querySelector('img')); });
    all.forEach(function(sl, i){
      var show = withPhoto.length ? withPhoto.indexOf(sl) !== -1 : i === 0;
      sl.style.display = show ? '' : 'none';
    });
    slides = all.filter(function(sl){ return sl.style.display !== 'none'; });
    dotsWrap.innerHTML = '';
    dots = slides.map(function(sl, i){
      var d = document.createElement('div');
      d.className = 'gallery-dot' + (i === 0 ? ' active' : '');
      d.setAttribute('data-index', String(i));
      d.addEventListener('click', function(){ main.scrollTo({left: main.clientWidth * i, behavior:'smooth'}); });
      dotsWrap.appendChild(d);
      return d;
    });
    dotsWrap.style.display = slides.length > 1 ? '' : 'none';
    setActiveDot(main.clientWidth ? Math.round(main.scrollLeft / main.clientWidth) : 0);
  }
  window.pennyImgSettled = buildGallery;
  buildGallery();
  window.addEventListener('load', buildGallery);

  main.addEventListener('scroll', function(){
    if(!main.clientWidth) return;
    setActiveDot(Math.round(main.scrollLeft / main.clientWidth));
  });

  var sizeWarning = document.getElementById('sizeWarning');
  var sizeSelect = document.getElementById('sizeSelect');
  sizeSelect.addEventListener('change', function(){
    if(sizeSelect.value && sizeWarning) sizeWarning.classList.remove('visible');
  });

  var qty = 1;

  var MAX_QTY = 10;  // per ring + size; the checkout worker enforces the same limit
  // Read the bag safely: anything broken or edited by hand is dropped instead of crashing the page.
  function loadCart(){
    try{
      var raw = window.localStorage.getItem(CART_KEY);
      var data = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(data)) return [];
      return data.filter(function(i){
        return i && typeof i.name === 'string' && typeof i.size === 'string' && isFinite(i.price) && Number(i.price) > 0;
      }).map(function(i){
        var q = Math.floor(Number(i.qty)) || 1;
        return { name: i.name.slice(0, 80), size: i.size.slice(0, 10), price: Number(i.price), qty: Math.min(MAX_QTY, Math.max(1, q)) };
      });
    }catch(e){ return []; }
  }

  function saveCart(cart){
    try{ window.localStorage.setItem(CART_KEY, JSON.stringify(cart)); return true; }catch(e){ return false; }
  }

  var addBtn = document.getElementById('addToCartBtn');
  var addBtnDefaultText = addBtn.textContent;
  addBtn.addEventListener('click', function(){
    var size = sizeSelect.value;
    if(!size){
      if(sizeWarning){ sizeWarning.textContent = 'please select a size'; sizeWarning.classList.add('visible'); }
      return;
    }
    if(sizeWarning) sizeWarning.classList.remove('visible');

    var cart = loadCart();
    var existing = cart.find(function(item){
      return item.name === PRODUCT_NAME && item.size === size;
    });
    if(existing){
      existing.qty = Math.min(MAX_QTY, existing.qty + qty);
    } else {
      cart.push({ name: PRODUCT_NAME, price: PRODUCT_PRICE, size: size, qty: qty });
    }
    if(!saveCart(cart)){
      if(sizeWarning){ sizeWarning.textContent = 'Could not add to cart. Please try again.'; sizeWarning.classList.add('visible'); }
      return;
    }

    addBtn.textContent = 'Added to Cart ✓';
    addBtn.classList.add('added');
    setTimeout(function(){
      addBtn.textContent = addBtnDefaultText;
      addBtn.classList.remove('added');
    }, 1600);
  });
})();
</script>
</body>
</html>
